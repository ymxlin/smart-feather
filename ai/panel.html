<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../options/options.css" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <h1 id="title"></h1>

    <section id="setup" hidden>
      <p data-i18n="aiNotConfigured"></p>
      <button id="openSettings" data-i18n="aiOpenSettings"></button>
    </section>

    <section id="work" hidden>
      <p id="destination" class="hint"></p>
      <label for="instruction" id="instructionLabel"></label>
      <input id="instruction" type="text" />
      <div class="row">
        <button id="generate"></button>
        <button id="cancel" data-i18n="aiCancel" hidden></button>
      </div>
      <p id="status" role="status"></p>
      <textarea id="suggestion" rows="12" hidden></textarea>
      <div class="row">
        <button id="insert" hidden></button>
      </div>
    </section>

    <script src="client.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
